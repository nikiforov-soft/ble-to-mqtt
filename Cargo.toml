[package]
name = "ble-to-mqtt"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
btleplug = { version = "0.11.8", features = ["serde"] }
serde = "1.0.228"
serde_json = "1.0.145"
uuid = "1.18.1"
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3.31"
envconfig = "0.11.0"
rumqttc = "0.25.0"
hex = "0.4.3"
anyhow = "1.0.100"
log = "0.4.28"
env_logger = "0.11.8"
memphis-rust-community = { version = "0.4.0", features = ["full"] }
async-trait = "0.1.89"
